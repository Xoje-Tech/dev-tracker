name: Publish to GHCR

# Triggers:
#   1. push: tags: dev-tracker-v* / v* — automatic when someone pushes a
#      release tag via regular `git push`.
#   2. workflow_dispatch: tag=<ref> — manual override for the
#      release-please edge case where its internal tag push doesn't
#      match the push: tags: filter. Use:
#        gh workflow run publish-ghcr -f tag=dev-tracker-v1.5.0
#      See issue #92.
on:
  push:
    tags:
      - 'dev-tracker-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push (e.g. dev-tracker-v1.5.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_dispatch passes the tag via inputs; regular tag
          # pushes have it on github.ref. Unify on the input or ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-tracker-server

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max