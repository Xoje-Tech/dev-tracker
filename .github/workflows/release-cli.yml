name: Release CLI Binaries

on:
  push:
    tags:
      - 'dev-tracker-v*'
      - 'v*'

jobs:
  build-and-release:
    name: Build and Upload CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        working-directory: ./cli
        run: pnpm install

      - name: Build and package CLI
        working-directory: ./cli
        run: |
          pnpm run package
          mv binaries/dev-tracker-cli-linux-x64 binaries/dt-linux-x64
          mv binaries/dev-tracker-cli-macos-x64 binaries/dt-macos-x64
          mv binaries/dev-tracker-cli-macos-arm64 binaries/dt-macos-arm64

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/binaries/dt-linux-x64
            cli/binaries/dt-macos-x64
            cli/binaries/dt-macos-arm64
