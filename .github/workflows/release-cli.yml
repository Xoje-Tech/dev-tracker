name: Release CLI Binaries

# Triggers:
#   1. push: tags: dev-tracker-v* / v* — automatic when someone pushes a
#      release tag via regular `git push`.
#   2. workflow_dispatch: tag=<ref> — manual override for the
#      release-please edge case where its internal tag push doesn't
#      match the push: tags: filter. Use:
#        gh workflow run release-cli -f tag=dev-tracker-v1.5.0
#      See issue #92.
on:
  push:
    tags:
      - 'dev-tracker-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build CLI binaries from (e.g. dev-tracker-v1.5.0)'
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and Upload CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_dispatch passes the tag via inputs; regular tag
          # pushes have it on github.ref. Unify on the input or ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        working-directory: ./cli
        run: pnpm install

      - name: Build and package CLI
        working-directory: ./cli
        run: |
          pnpm run package
          mv binaries/dev-tracker-cli-linux-x64 binaries/dt-linux-x64
          mv binaries/dev-tracker-cli-macos-x64 binaries/dt-macos-x64
          mv binaries/dev-tracker-cli-macos-arm64 binaries/dt-macos-arm64

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/binaries/dt-linux-x64
            cli/binaries/dt-macos-x64
            cli/binaries/dt-macos-arm64
