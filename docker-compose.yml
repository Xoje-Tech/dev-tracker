services:
  dev-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/xoje-tech/dev-tracker:local
    container_name: dev-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./data/dev.db
      # Required: set SESSION_SECRET in a .env file next to this compose file.
      # Generate one with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — set it in .env or your shell}
    volumes:
      - dev-tracker-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dev-tracker-data:
    name: dev-tracker-data