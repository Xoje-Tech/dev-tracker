# pnpm 11+ per-project settings.
# This file is the new home for pnpm settings (previously nested under `pnpm` in package.json).
# Reference: https://pnpm.io/settings

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sqlite3: true

packages:
  - "packages/*"
  # F1.1 collapsed the legacy `["", "cli"]` form to glob-only.
  # `cli/` is still a workspace package until F3.1 moves it to
  # packages/cli/. Without this entry, `pnpm -F dev-tracker-cli ...`
  # fails with "No projects matched the filters".
  - "cli"
