# pnpm 11+ per-project settings.
# This file is the new home for pnpm settings (previously nested under `pnpm` in package.json).
# Reference: https://pnpm.io/settings

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sqlite3: true

packages:
  # F3.1 moved cli/ → packages/cli/. The glob `packages/*` now covers
  # it alongside backend, frontend, and client. No legacy `cli` entry.
  - "packages/*"
