services:
  dev-tracker-server:
    image: ghcr.io/xoje-tech/dev-tracker-server:latest
    build: .
    ports:
      - "127.0.0.1:6789:6789"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - SESSION_SECRET=dev-secret-change-me-in-production
    restart: unless-stopped
