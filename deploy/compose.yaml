services:
  dev-tracker-server:
    image: ghcr.io/xoje-tech/dev-tracker-server:latest
    ports:
      - "127.0.0.1:6789:3000"  # Expose locally for local CLI and MCP
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"             # Map to unprivileged port on host (change to 80 if running as root/privileged start)
      - "8443:443"            # Map to unprivileged port on host (change to 443 if running as root/privileged start)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - dev-tracker-server
